log:
    level: 4
    file_path: /dev/stdout
    format: string

http:
    - tag: main
      addr: 127.0.0.1:8090

admin:
    tag: main

sqlite:
    - tags: master
      file: /tmp/jasta-admin-dev.sqlite
      cache: private
      mode: rwc
      journal: WAL
      locking_mode: EXCLUSIVE
      other_params: _foreign_keys=on
