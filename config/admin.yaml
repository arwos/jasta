env: prod

log:
    file_path: /dev/stdout
    format: string
    level: 4

http:
    - addr: 127.0.0.1:15433
      tag: main

admin:
    tag: main

sqlite:
    - tags: master
      file: /var/lib/jasta/admin.sqlite
      cache: private
      mode: rwc
      journal: WAL
      locking_mode: EXCLUSIVE
      other_params: _foreign_keys=on
