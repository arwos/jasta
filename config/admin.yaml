env: prod

log:
    file_path: /dev/stdout
    format: string
    level: 4

http:
    - addr: 127.0.0.1:15433
      tag: main

admin:
    tag: main
    nginx:
        admin_domain: ""
        config_path: /etc/nginx/conf.d/jasta.conf
        challenge_root: /var/lib/jasta/acme-challenges
        public_proxy: 127.0.0.1:15432
        admin_proxy: 127.0.0.1:15433
        admin_certificate: ""
        admin_private_key: ""

sqlite:
    - tags: master
      file: /var/lib/jasta/admin.sqlite
      cache: private
      mode: rwc
      journal: WAL
      locking_mode: EXCLUSIVE
      other_params: _foreign_keys=on
