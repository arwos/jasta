package: jasta
source: jasta
version: git
architecture:
    - amd64
    - arm64
maintainer: The OSSPkg Team <github@osspkg.com>
homepage: https://jasta.arwos.org/
description:
    - Gateway for Static Website
section: utils
priority: optional
control:
    depends:
        - systemd
        - ca-certificates
        - nginx
        - libc6
    conffiles:
        - /etc/jasta/config.yaml
        - /etc/jasta/admin.yaml
        - /etc/jasta/websites/localhost.yaml
    build: scripts/build-deb.sh %arch%
    preinst: scripts/jasta_preinst.sh
    postinst: scripts/jasta_postinst.sh
    prerm: scripts/jasta_prerm.sh
    postrm: scripts/jasta_postrm.sh
data:
    usr/bin/jasta: build/jasta_%arch%
    etc/jasta/config.yaml: config/config.yaml
    etc/jasta/admin.yaml: config/admin.yaml
    etc/jasta/websites/localhost.yaml: config/websites/localhost.yaml
    etc/sudoers.d/jasta: init/jasta-admin.sudoers
    etc/nginx/conf.d/jasta.conf: init/jasta-nginx.conf
    usr/lib/systemd/system/jasta-web.service: init/jasta-web.service
    usr/lib/systemd/system/jasta-admin.service: init/jasta-admin.service
    usr/lib/sysusers.d/jasta.conf: init/jasta.sysusers
    usr/lib/tmpfiles.d/jasta.conf: init/jasta.tmpfiles
